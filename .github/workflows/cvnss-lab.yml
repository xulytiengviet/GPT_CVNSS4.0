name: Vietnamese GPT laboratory smoke

on:
  push:
    branches: [main]
    paths:
      - 'cvnss/**'
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/cvnss-lab.yml'
  pull_request:
    branches: [main]

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies for the laboratory checks
        run: python -m pip install 'tokenizers>=0.13,<1'
      - name: Python syntax and converter JS
        run: |
          python -m compileall -q cvnss
          node --check cvnss/convert.js
          node --check docs/assets/site.js
          node --check docs/vendor/converter.js
          node -e "const x=require('./cvnss/vendor/converter.js').selfTest(); if(!x.ok||x.tests!==23) process.exit(1);"
      - name: JSONL and converter regression tests
        run: python -m unittest discover -s cvnss/tests -p 'test_*.py' -v
      - name: Build both language tokenizers
        run: |
          python -m cvnss.prepare --mode unicode
          python -m cvnss.prepare --mode cvnss
          python -m cvnss.tokenizer --mode unicode --vocab-size 2048
          python -m cvnss.tokenizer --mode cvnss --vocab-size 2048
          python -c "from tokenizers import Tokenizer; assert Tokenizer.from_file('cvnss/tokenizer_unicode.json').get_vocab_size()>260"
          python -c "from tokenizers import Tokenizer; assert Tokenizer.from_file('cvnss/tokenizer_cvnss.json').get_vocab_size()>260"
      - name: Validate static website artifacts
        run: |
          test -f docs/index.html
          test -f docs/vendor/converter.js
          test -f docs/assets/site.css
          test -f docs/assets/site.js
          test -f index.html

  train-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python 3.11 and dependencies
        run: |
          uv python install 3.11
          uv sync --python 3.11
      - name: Build both variants and train a short smoke checkpoint
        run: |
          uv run python -m cvnss.cli prepare --mode unicode
          uv run python -m cvnss.cli prepare --mode cvnss
          uv run python -m cvnss.cli tokenizer --mode unicode
          uv run python -m cvnss.cli tokenizer --mode cvnss
          uv run python -m cvnss.cli train --mode unicode --device cpu --max-steps 25
          uv run python -m cvnss.cli evaluate --mode unicode
          uv run python -m cvnss.cli train --mode cvnss --device cpu --max-steps 25
          uv run python -m cvnss.cli evaluate --mode cvnss
          test -f cvnss/checkpoints/unicode/best.pt
          test -f cvnss/checkpoints/cvnss/best.pt
          test -f cvnss/checkpoints/unicode/metrics.json
          test -f cvnss/checkpoints/cvnss/metrics.json
